<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCS Inspection and Repair Quote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout concept: step rail on the left, a clickable iPad screen in the centre, and a notes panel on the right that keeps what Brian said apart from what we propose and what is still open. */
:root{
  --bg:#f2f3ef; --surface:#ffffff; --surface2:#f6f7f3; --line:#d8dbd3;
  --fg:#1c2220; --muted:#5b645f; --accent:#1c7d2e; --accent-fg:#ffffff; --navy:#1b2a4a;
  --warn-bg:#fff3d1; --warn-line:#d9b13f; --warn-fg:#654700;
  --said-bg:#dff0e2; --said-fg:#15511f; --ours-bg:#e4e9f6; --ours-fg:#233a73;
  --bad-bg:#f8d9d5; --ok-bg:#dff0e2;
  --b-green:#7cc58b; --b-amber:#f2cf5b; --b-orange:#f0a04b; --b-red:#e3685f; --on-band:#1c2220;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111512; --surface:#1a201c; --surface2:#212823; --line:#364038;
    --fg:#e8ece8; --muted:#9ba69e; --accent:#4fbf66; --accent-fg:#0c180f; --navy:#223760;
    --warn-bg:#3a3012; --warn-line:#8a6d1c; --warn-fg:#f0d58a;
    --said-bg:#1d3a24; --said-fg:#a9e0b4; --ours-bg:#222c4a; --ours-fg:#b4c4f0;
    --bad-bg:#4a2420; --ok-bg:#1d3a24; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111512; --surface:#1a201c; --surface2:#212823; --line:#364038;
  --fg:#e8ece8; --muted:#9ba69e; --accent:#4fbf66; --accent-fg:#0c180f; --navy:#223760;
  --warn-bg:#3a3012; --warn-line:#8a6d1c; --warn-fg:#f0d58a;
  --said-bg:#1d3a24; --said-fg:#a9e0b4; --ours-bg:#222c4a; --ours-fg:#b4c4f0;
  --bad-bg:#4a2420; --ok-bg:#1d3a24; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:16px}
.wrap{max-width:1340px;margin:0 auto;padding-block:20px 48px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:19px;font-weight:800;margin:0;text-wrap:balance}
h3{font-size:12px;font-weight:700;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:0 0 8px}
.muted{color:var(--muted)}
.top{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.top p{max-width:62ch;color:var(--muted);margin-top:4px}
.ctrls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-weight:600;border:0;background:transparent;color:var(--fg);padding:9px 14px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.key{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.tag.said{background:var(--said-bg);color:var(--said-fg)}
.tag.ours{background:var(--ours-bg);color:var(--ours-fg)}
.tag.ask{background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-line)}
.layout{display:grid;grid-template-columns:190px minmax(0,1fr) 310px;gap:20px;align-items:start}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.rail button{font:inherit;width:100%;text-align:left;display:flex;gap:10px;align-items:center;border:1px solid transparent;background:transparent;color:var(--muted);padding:8px 10px;border-radius:8px;cursor:pointer;min-height:40px}
.rail .n{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.rail .on{background:var(--surface);border-color:var(--line);color:var(--fg);font-weight:700}
.rail .on .n{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.rail .vis .n{border-color:var(--accent);color:var(--accent)}
.rail .cv{font-size:11px;color:var(--warn-fg);background:var(--warn-bg);border-radius:4px;padding:0 6px}
.device{background:var(--surface);border:2px solid var(--fg);border-radius:22px;overflow:hidden;min-width:0}
.dbar{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--navy);color:#fff;flex-wrap:wrap}
.dbar b{font-weight:800;letter-spacing:.02em}
.dbar .btn{min-height:34px;padding:4px 12px;font-size:13px;background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.screen{padding:16px;height:600px;overflow:auto}
.dfoot{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface2)}
.btn{font:inherit;font-weight:700;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 16px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-block:12px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between;flex-wrap:wrap}
.crumb{color:var(--muted);font-size:12px;margin-bottom:6px}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.badge.acc{background:var(--warn-bg);color:var(--warn-fg)}
.badge.prog{background:var(--ours-bg);color:var(--ours-fg)}
.badge.done{background:var(--said-bg);color:var(--said-fg)}
.parts{margin:8px 0 14px;padding-left:18px;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13px}
.fld input,.fld textarea,.fld select{font:inherit;font-weight:500;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
.fld input[readonly]{background:var(--surface2);color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.dampgrid{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px}
.diag{flex:1 1 380px;min-width:0}
.side{flex:0 1 230px;min-width:210px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:inherit;font-weight:600;font-size:13px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 10px;min-height:38px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.tabs i{font-style:normal;font-weight:500;opacity:.7;margin-left:4px}
svg.diagram{width:100%;height:auto;display:block;background:var(--surface2);border:1.5px dashed var(--line);border-radius:10px;touch-action:manipulation;cursor:crosshair}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:3px;border:1px solid var(--fg)}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tools button{font:inherit;font-size:10.5px;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-height:56px}
.tools button[aria-pressed="true"]{border-color:var(--accent);background:var(--said-bg)}
.tools svg{width:100%;height:34px}
.readout{border:1.5px solid var(--line);border-radius:8px;min-height:50px;display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;color:var(--on-band)}
.readout small{font-size:11px;font-weight:600;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.pad button{font:inherit;font-size:18px;font-weight:700;min-height:46px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;cursor:pointer}
.pad .go{background:var(--fg);color:var(--surface);border-color:var(--fg);font-size:14px}
.icbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.secs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.secs button{font:inherit;font-weight:600;font-size:13px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 10px;min-height:38px;cursor:pointer}
.secs button[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.secs i{font-style:normal;font-weight:500;opacity:.7;margin-left:4px}
.line{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.line .lbl{flex:1 1 220px;min-width:0;font-weight:600}
.pf{display:inline-flex;gap:6px}
.pf button{font:inherit;font-weight:700;min-width:50px;min-height:44px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;cursor:pointer}
.pf button[aria-pressed="true"].P{background:var(--b-green);border-color:var(--fg);color:var(--on-band)}
.pf button[aria-pressed="true"].F{background:var(--b-red);border-color:var(--fg);color:var(--on-band)}
.pf button[aria-pressed="true"].N{background:var(--line);border-color:var(--fg)}
.pf button[aria-pressed="true"].R{background:var(--b-amber);border-color:var(--fg);color:var(--on-band)}
.extra{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:8px}
.extra .fld{flex:1 1 240px}
.tyre{display:grid;grid-template-columns:110px repeat(5,minmax(60px,1fr));gap:6px;align-items:center;overflow-x:auto;min-width:0}
.tyre input{font:inherit;min-height:40px;width:100%;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);padding:4px 8px;min-width:0}
.tyre b{font-size:12px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:4px 16px}
.checks label{display:flex;gap:10px;align-items:center;min-height:40px;font-weight:500}
.checks input{width:20px;height:20px;accent-color:var(--accent)}
.block{margin-top:16px}
.sigpad{width:100%;height:140px;border:1.5px dashed var(--line);border-radius:8px;background:var(--surface2);touch-action:none;display:block}
.sumrow{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.sumrow div{border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-width:120px}
.sumrow b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.notes{position:sticky;top:12px;display:flex;flex-direction:column;gap:10px}
.notes h2{font-size:16px}
.nitem{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:10px}
.nitem p{margin:0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;z-index:9;max-width:90vw}
@media (max-width:1120px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .rail ol{flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .rail button{white-space:nowrap;width:auto}
  .notes{position:static}
}
.dbar[data-actor="Customer"]{background:#2a5a47}
.dbar[data-actor="MCS admin"]{background:#4a2f5e}
.rules{margin-bottom:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 14px}
.rules summary{cursor:pointer;font-weight:700}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:10px}
.rgrid label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13px}
.rgrid input,.rgrid select{font:inherit;min-height:40px;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.rgrid .ck{flex-direction:row;align-items:center;gap:8px;min-height:40px}
.rgrid .ck input{min-height:0;width:18px;height:18px}
.lnrow{display:grid;grid-template-columns:minmax(120px,1fr) 110px auto auto;gap:8px;align-items:end;margin-bottom:8px}
.lnrow label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.lnrow input,.inp{font:inherit;min-height:42px;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);min-width:0;width:100%}
.mt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.mt td{padding:5px 0;border-bottom:1px solid var(--line)}
.mt td:last-child{text-align:right;font-weight:600}
.mt tr.tot td{font-weight:800;font-size:16px;border-bottom:2px solid var(--fg)}
.mt tr.sub td{color:var(--muted);font-size:12.5px}
.banner{border-radius:8px;padding:10px 12px;margin-bottom:12px;font-weight:600;background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-line)}
.banner.ok{background:var(--said-bg);color:var(--said-fg);border-color:var(--said-fg)}
.banner.bad{background:var(--bad-bg);color:var(--fg);border-color:var(--b-red)}
.hint{flex:1;text-align:center;color:var(--muted);font-size:12.5px;align-self:center}
.logl{margin:0;padding-left:18px;color:var(--muted);font-size:12.5px}
.doc{border:1.5px solid var(--fg);border-radius:6px;padding:14px;background:var(--surface)}
@media (max-width:640px){.lnrow{grid-template-columns:1fr 1fr}}
/* ---- walkthrough shell v2 ---- */
.hdrstrip{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12.5px;color:var(--muted);padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);margin-bottom:12px}.hdrstrip b{color:var(--fg);font-weight:700;margin-right:4px}
.tyre input.miss{background:var(--bad-bg)}
.checks label.miss{background:var(--bad-bg);border-radius:6px}.block.miss{background:var(--bad-bg);border-radius:8px;padding:6px 8px}
.line.miss,.fld.miss input{background:var(--bad-bg)}.line.miss{border-radius:8px;padding-inline:8px}.line.hl{outline:2px solid var(--accent);border-radius:8px}
.disc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface2);font-size:12.5px;margin-top:12px}.disc b{display:block;margin-bottom:2px}.disc p{margin:0}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--surface)}
[hidden]{display:none!important}
.home{max-width:920px;margin:8px auto 0}
.home h2{font-size:clamp(26px,4vw,38px);line-height:1.12;margin:0 0 12px;max-width:20ch}
.home .lede{font-size:17px;max-width:62ch;color:var(--fg);margin-bottom:18px}
.home .startrow{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:34px}
.hsec{display:grid;grid-template-columns:200px minmax(0,1fr);gap:8px 32px;padding:22px 0;border-top:1px solid var(--line)}
.hsec>h3{font-size:14px;text-transform:none;letter-spacing:0;color:var(--fg);font-weight:800;margin:0}
.hsec ul,.hsec ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.hsec .who{display:grid;grid-template-columns:130px minmax(0,1fr);gap:4px 16px;margin:0}
.hsec .who dt{font-weight:700}.hsec .who dd{margin:0;color:var(--muted)}
.hsec .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px 32px}
.hsec h4{margin:0 0 6px;font-size:13px;color:var(--muted)}
.hsec .open li{color:var(--warn-fg)}
@media (max-width:760px){.hsec{grid-template-columns:1fr}.hsec .who{grid-template-columns:1fr}}
.stage.noguide{grid-template-columns:minmax(0,1fr)}
.stage.noguide .guide{display:none}
::selection{background:var(--accent);color:var(--accent-fg)}
*{scrollbar-color:var(--line) transparent}
.pre:focus-within,.inp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pre input:focus-visible{outline:0}
input[type=checkbox]{accent-color:var(--accent)}
.wrap{max-width:1380px}
.hdr{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;gap:12px;align-items:center}
.logo{display:inline-grid;place-items:center;background:var(--accent);color:var(--accent-fg);font-weight:800;letter-spacing:.04em;border-radius:8px;width:38px;height:38px;font-size:13px;flex:none}
.brand h1{font-size:20px}
.brand p{margin:0;color:var(--muted);font-size:13px}
.hctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn.ghost{background:transparent}
.rules{margin:0 0 14px;padding:14px 16px}
.rules h2{font-size:15px;margin-bottom:2px}
.rules>p{color:var(--muted);margin:0 0 4px;font-size:13px}
.journey{display:flex;gap:0;overflow-x:auto;padding:4px 2px 12px;margin-bottom:6px;scrollbar-width:thin}
.jp{font:inherit;flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px 8px 12px;border-radius:10px;cursor:pointer;min-height:48px;margin-right:6px;position:relative}
.jp .jl{font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px}
.jp{min-height:40px}
.jp .dot{width:9px;height:9px;border-radius:50%;background:var(--navy);flex:none}
.jp .dot.Customer{background:#2a8a62}.jp .dot.Engineer{background:#2f4f9c}.jp .dot.MCS-admin{background:#7b4aa0}
.jp.on{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.jp.on small{color:inherit;opacity:.75}
.jp.vis:not(.on){border-color:var(--accent)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.device{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.app{display:grid;grid-template-columns:168px minmax(0,1fr);min-height:680px}
.appnav{background:var(--navy);color:#fff;padding:16px 10px;display:flex;flex-direction:column;gap:4px}
.appnav.adm{background:#3a2850}

.appnav .ni.on{background:rgba(255,255,255,.14);color:#fff}
.appnav .usr{margin-top:auto;display:flex;gap:8px;align-items:center;font-size:12px;padding:8px 6px;border-top:1px solid rgba(255,255,255,.18)}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.main{display:flex;flex-direction:column;min-width:0;background:var(--bg)}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const VIEWS=['front','rear','nearside','offside','ceiling','floor'];

 {id:'gas',name:'LPG gas systems',lines:['Regulator, gas hose, pipework and manifold','Carry out gas tightness check','Check security of LPG tank (if fitted)','Security of gas cylinder(s)','Ensure all gas dispersal vents are clear','Appliances: check operation of all gas appliances fitted including FFDs']},

 {id:'fire',name:'Fire safety',lines:['Press test button on smoke alarm to test electrical circuitry and sound alarm (if fitted)','Press test button on CO alarm to test electrical circuitry and sound alarm (if fitted)','If a fire extinguisher is fitted, check security of its housing (see below)','Smoke and/or carbon monoxide alarm(s) if fitted']}

const SEC_C=[
 {id:'chas',name:'Chassis and running gear',lines:['Coupling head','Ball acting stabiliser','Coupling head gaiter','Breakaway cable and slip','Drawbar','Corner steadies','Spare wheel carrier (if fitted)','Jockey wheel','Chassis','Braking system','Wheels and tyres','Suspension and axle','Handbrake mechanism']},
 {id:'elec',name:'Electrical system',lines:['13pin/7pin plugs, cables and storage position','Road lights and reflectors','Leisure battery (if fitted)','Battery compartment','230V and 12V fridge operation','Interior lighting and equipment','Awning light','Wiring on ELV circuits (visual)','LV inlet plug and extension lead','Earth bonding continuity test','230V consumer unit load test RCD','230V sockets','Charge voltage','Check operation of all 230V appliances, fans and luminaires','Check all aftermarket items']},
 {id:'gas',name:'LPG gas system',lines:['Regulator, gas hose, pipework and manifold','Carry out gas tightness check','Appliances: check operation of all gas appliances fitted including FFDs','Security of gas cylinder(s)','Ensure all gas dispersal vents are clear']},
 {id:'water',name:'Water system',lines:['Water pump and pressure switch/microswitches','Taps, valves, pipes and tank (if fitted)','Water inlets','Waste system','Toilet','@yn:No test due to frost']},
 {id:'body',name:'Bodywork',lines:['Doors and windows','General condition of bodywork including roof','External seals and bonded joints condition','Roof straps (if applicable)','Grab handles','Number plate: check it is marked BS AU 145d or BS Au 145 (mandatory since 1973) and check security and legibility','Floor','Furniture','Blinds and fly screens','Rising roof (if applicable)','Charge voltage','Damp test: carry out and note reading on the separate damp report sheet']},
 {id:'vent',name:'Ventilation',lines:['Fixed ventilation (low and high levels)','Roof lights']},
 {id:'fire',name:'Fire safety',lines:['Press test button on smoke alarm to test electrical circuitry and sound alarm (if fitted)','Press test button on CO alarm to test electrical circuitry and sound alarm (if fitted)','If a fire extinguisher is fitted, check security of its housing (see below)','Smoke and/or carbon monoxide alarm(s) if fitted']}
];
const secs=()=>S.vehicle==='caravan'?SEC_C:SEC_M;
const TESTS=[['bat','Battery rest voltage'],['rcd1','RCD test, 1xΔn'],['rcd5','RCD times, 5xΔn'],['earth','Earth bond, chassis Ω'],['cont','Continuity test, gas Ω'],['chg','Charger voltage'],['hose','Gas hose expiry date'],['reg','Regulator age']];
const tests=()=>TESTS;
const DATES=[['smoke','Smoke alarm expiry date (if visible)'],['co','Carbon monoxide alarm expiry date (if visible)'],['ext','Fire extinguisher expiry date']];
const OLDPARTS='Old parts left in vehicle (if suitable)';
const DISC_DETAILS='IMPORTANT: All appliances are tested for operation only. This does not confirm that they are working to the prescribed standard. Additional servicing may be required for warranty purposes/products (e.g. fridge).';
const DISC_M='This service report only relates to the condition of the above mentioned motorhome at the time of completion of the service. It should not be regarded as evidence of the condition of the items at any other time. Important: Appliances are checked for operation only, additional servicing may be required for warranty purposes. The habitation service does not include any servicing of the base vehicle and road legal requirements.';
const DISC_C='This service report only relates to the condition of the above mentioned motorhome at the time of completion of the service. It should not be regarded as evidence of the condition of the items at any other time. Important: Appliances are checked for operation only, additional servicing may be required for warranty purposes.';
const DAMP_BANDS=[['green','0 to 15%','No cause for concern. Only readings of over 15% are recorded.'],['amber','15 to 20%','May require further investigation. Compare with average readings and consider a recheck after 3 months.'],['orange','20 to 30%','Will require further investigation to look for other possible indications of water ingress. Possible resealing required to avoid further degrading.'],['red','30% and above','May indicate that structural damage or deterioration is occurring. Possible resealing required to avoid further degrading, followed by immediate rectification action as necessary.']];
const DAMP_NOTE='We would emphasise that the above report accurately reflects the condition of your motorhome at the date stated. These readings may be subject to atmospheric conditions and the company cannot accept any liability for damp, which may become apparent at a future date. Completed in line with the latest AWS Damp Testing Matrix and carried out in accordance with the latest AWS service technician\'s handbook and manufacturers guidance in relation to areas required to tests. Only the inside of the habitation unit is tested. Personal belongings will not be removed from lockers and storage areas, which therefore, may limit the scope of the damp report.';
const disc=t=>`<div class="disc"><b>Disclaimer</b><p>${t}</p></div>`;
const isYN=l=>l.startsWith('@yn:');
const hdr=()=>`<div class="hdrstrip"><span><b>Customer</b> Sarah Johnson</span><span><b>Make and model</b> ${veh().name}</span><span><b>VIN</b> ${S.f.vin?esc(S.f.vin):'not entered yet'}</span>${S.vehicle==='motorhome'&&S.f.miles?`<span><b>Mileage</b> ${esc(S.f.miles)}</span>`:''}<span><b>Job</b> ${esc(S.f.jobref||'MCS-20487')}</span></div>`;
const dtin=(k,l)=>{const na=S.f[k]==='N/A';return `<label class="fld ${S.showMissing&&!String(S.f[k]??'').trim()?'miss':''}"><span>${l}</span><span class="row"><input type="date" data-f="${k}" value="${na?'':fv(k)}" ${na?'disabled':''} style="flex:1"><button type="button" class="btn sm" data-act="na" data-a="${k}" aria-pressed="${na}">N/A</button></span></label>`;};
function problems(){
  const p=[], fi=secs().length-1;
  secs().forEach((sc,si)=>sc.lines.forEach((l,i)=>{const k=sc.id+i;if(!S.chk[k])p.push({t:sc.name+': '+(isYN(l)?l.slice(4):l),go:['check',si,k]});}));
  DATES.forEach(([k,l])=>{if(!String(S.f[k]??'').trim())p.push({t:'Fire safety: '+l,go:['check',fi,k]});});
  if(!S.eicr)p.push({t:'EICR offered: choose Yes, No or N/A',go:['final',null,'eicr']});
  HAND.forEach(h=>{const k='h:'+h;if(!S.tick[k]&&!(h===OLDPARTS&&S.f.hna==='N/A'))p.push({t:'Hand-over: '+h,go:['final',null,k]});});
  tests().forEach(([k,l])=>{if(!String(S.f[k]??'').trim())p.push({t:'Test result: '+l,go:['final',null,k]});});
  if(S.vehicle==='caravan'){
    [['torque','Torque setting'],['tsig','Signature'],['tname','Name'],['tsig2','Double check signature (or N/A)'],['tname2','Double check name (or N/A)']].forEach(([k,l])=>{if(!String(S.f[k]??'').trim())p.push({t:'Wheel bolt torque: '+l,go:['final',null,k]});});
    TYROWS.forEach(([r,l])=>TYCOLS.forEach((c,i)=>{const k='ty'+r+i;if(!String(S.f[k]??'').trim())p.push({t:'Tyres: '+l+' '+c,go:['final',null,k]});}));
  }
  if(!(S.proof.video||S.proof.photos>0))p.push({t:'Job proof: add a video or photos',go:['proof']});
  if(!S.sig.tech||!S.sig.cust)p.push({t:'Engineer and customer signatures',go:['sign']});
  return p;
}
function grouped(){
  const out=[],seen={};
  const add=(key,x,label)=>{if(seen[key]){seen[key].n++;return;}seen[key]={n:1,go:x.go,label};out.push(seen[key]);};
  problems().forEach(x=>{
    if(x.go[0]==='check')add('c'+x.go[1],x,'Checklist, '+secs()[x.go[1]].name);
    else if(x.t.startsWith('Hand-over: '))add('h',x,'Hand-over checks');
    else if(x.t.startsWith('Test result: '))add('t',x,'Test readings');
    else if(x.t.startsWith('Wheel bolt torque: '))add('w',x,'Wheel bolt torque');
    else if(x.t.startsWith('Tyres: '))add('y',x,'Tyres');
    else out.push(x);
  });
  return out.map(x=>x.n?{t:x.label+': '+x.n+' not done',go:x.go}:x);
}
function missBanner(){
  if(!S.showMissing)return '';
  const p=grouped(), total=problems().length;
  if(!p.length)return '<div class="banner ok">Everything is complete. You can submit.</div>';
  return `<div class="banner bad"><b>${total} thing${total>1?'s':''} to finish before you can submit</b><ul class="parts" style="margin:6px 0 0;color:var(--fg)">${p.map((x,i)=>`<li>${esc(x.t)} <button class="btn sm" data-act="fix" data-a="${i}">Go to it</button></li>`).join('')}</ul></div>`;
}
const tin=(k,l)=>`<label class="fld ${S.showMissing&&!String(S.f[k]??'').trim()?'miss':''}"><span>${l}</span><span class="row"><input data-f="${k}" value="${fv(k)}" style="flex:1"><button type="button" class="btn sm" data-act="na" data-a="${k}" aria-pressed="${S.f[k]==='N/A'}">N/A</button></span></label>`;
function sDampNotes(){
  return `${hdr()}<h2>Damp report notes</h2><p class="muted">Sheet 3 of 4</p>
  
  <div class="panel"><h3>Guidance notes</h3>${DAMP_BANDS.map(([c,r,t])=>`<div class="chk"><i style="background:var(--b-${c});width:14px;height:14px;border-radius:3px"></i><span><b>${r}</b>: ${t}</span></div>`).join('')}</div>
  <label class="fld block"><span>Comments and recommendations</span><textarea data-f="dcomm" rows="6" placeholder="Add anything the customer should know about the damp readings">${fv('dcomm')}</textarea></label>
  ${disc(DAMP_NOTE).replace('Disclaimer','Please note')}`;
}

const TOOLS=[['window','Window'],['windowsq','Window sq.'],['ac','AC unit'],['acsq','AC sq.'],['fan','Fan'],['toilet','Toilet'],['shower','Shower'],['notest','No test']];

const BANDS=[['green','0 to 15%'],['amber','15 to 20%'],['orange','20 to 30%'],['red','30% and over']];

const NOTES={
 dampnotes:{t:'Damp report notes',did:'The first page of the damp report: what each reading band means, a box for comments and recommendations, and the Please note paragraph.',i:[['said','The first page of the damp report was missing. It is on the original paperwork.'],['ours','Placed after the drawings so the engineer writes comments once the readings are in. The paper has it first.'],['ask','Does the report keep the AWS wording? The paper says motorhome on the caravan page too.']]},

  ['ours','Prefilled from the booking so the engineer types only what is new.'],

const qh=l=>Math.round((+l.h||0)*4)/4;
const mkPct=c=>((+c||0)>=RULES.mkThreshold?RULES.mkHigh:RULES.mkLow);
const partSell=c=>{c=+c||0;return c*(1+mkPct(c)/100);};
function calc(){
  const pc=R.parts.reduce((n,p)=>n+(+p.c||0),0);
  const psell=R.parts.reduce((n,p)=>n+partSell(p.c),0), mk=psell-pc;
  const car=R.deliv.reduce((n,d)=>n+(+d.c||0),0);
  const hours=R.labour.reduce((n,l)=>n+qh(l),0), lab=hours*RULES.rate;
  const base=RULES.vatBase==='sell'?psell+car:RULES.vatBase==='cost'?pc+car:psell+car+lab;
  const vat=RULES.vat?base*RULES.vatRate/100:0;
  const total=psell+car+lab+vat;
  const credit=RULES.deduct&&R.src==='assessment'?Math.min(RULES.callout,total):0;
  const engP=RULES.shareMode==='markup15'?mk*0.15:pc*RULES.partShare/100, engL=lab*(1-RULES.fee/100);
  const supVat=RULES.vat?(pc+car)*RULES.vatRate/100:0;
  const keeps=psell+lab-pc-engP-engL;
  return {pc,psell,mk,car,hours,lab,vat,total,credit,due:total-credit,engP,engL,eng:engP+engL,supVat,keeps};
}

}

}

    case 'reqpay':if(!R.reqf.fault.trim()){toast('Describe what is wrong first.');break;}R.reqf.paid=true;logr('Customer sent a service request and paid the call-out charge '+money(RULES.callout));keep();render();break;
    case 'tobuild':R.src='assessment';go('build');break;
    case 'padd':R.parts.push({d:'',c:'',r:false});keep();render();break;
    case 'ladd':R.labour.push({d:'',h:''});keep();render();break;
    case 'prm':R.parts.splice(+a,1);keep();render();break;
    case 'lrm':R.labour.splice(+a,1);keep();render();break;
    case 'rcpt':R.parts[+a].r=!R.parts[+a].r;keep();render();break;
    case 'suggest':{
      const found=[];secs().forEach(s=>s.lines.forEach((l,i)=>{if(S.chk[s.id+i]==='F')found.push(l);}));
      if(!found.length){toast('No failed lines yet. Mark a line F in the inspection checklist, or add lines by hand.');break;}
      found.forEach(l=>{const d='Fix: '+l;if(!R.labour.some(x=>x.d===d))R.labour.push({d,h:''});});
      keep();render();break;}
    case 'send':{
      const bad=R.parts.some(p=>!p.d.trim()||!(+p.c>0))||R.labour.some(l=>!l.d.trim()||!(+l.h>0));
      if(!R.parts.length&&!R.labour.length){toast('Add at least one part or labour line.');break;}
      if(bad){toast('Every line needs a description and a number above zero.');break;}
      R.sent=true;R.declined='';R.status='Sent';logr('Engineer sent quote version '+R.ver+' ('+money(calc().total)+')');keep();render();break;}
    case 'editq':R.ver++;R.sent=false;R.declined='';R.status='Draft';R.terms=false;R.signName='';logr('Engineer started quote version '+R.ver);keep();render();break;
    case 'accept':if(!R.terms||!R.signName.trim()){toast('Tick the terms and type your name first.');break;}R.accepted=R.paid=true;R.status='Paid';logr('Customer accepted and paid '+money(calc().due));logr('Email sent to MCS: quote paid, order the parts');render();toast('Email sent to MCS Network: quote paid, order the parts.');break;
    case 'decline':R.declined=(R.declineText||'').trim()||'No reason given';R.status='Declined';logr('Customer declined: '+R.declined);render();break;
    case 'when':R.mode=a;keep();render();break;
    case 'doc':R.doc=a;keep();render();break;
    case 'day':R.date=a;keep();render();break;
    case 'sched':{
      if(R.mode==='later'&&diaryCount(R.date)>=5){toast('That day already has 5 jobs. Pick another date.');break;}
      R.sched=R.mode==='same'?'same visit as the inspection':dnice(R.date);R.status='Scheduled';logr('Repair put in the diary: '+R.sched);keep();render();break;}
    case 'reassign':R.reassigned=!R.reassigned;R.eng=R.reassigned?'Priya Shah':'Tom Mitchell';logr('MCS set the engineer to '+R.eng);keep();render();break;
    case 'rvid':R.proof.video=!R.proof.video;keep();render();break;
    case 'rph':R.proof.photos=Math.min(8,R.proof.photos+1);keep();render();break;
    case 'rsub':if(!(R.proof.video||R.proof.photos>0)){toast('Add a video or photos first.');break;}R.submitted=true;R.backNote='';R.status='Awaiting MCS check';logr('Engineer submitted the repair proof');keep();render();break;
    case 'rapprove':R.approved=true;R.status='Completed';logr('MCS signed off the repair; '+money(calc().eng)+' released to the engineer job pot');keep();render();break;
    case 'rback':{const t=(R.backText||'').trim();if(!t){toast('Write why the job is sent back first.');break;}R.submitted=false;R.approved=false;R.backNote=t;R.backText='';R.status='Scheduled';logr('MCS sent the repair back: '+t);go('work');break;}
    case 'iapprove':S.approved=true;S.backNote='';keep();render();break;
    case 'iback':{const t=(S.f.backreason||'').trim();if(!t){toast('Write why the job is sent back first.');break;}S.backNote=t;S.f.backreason='';go('proof');break;}
    case 'toquote':M='rep';R.src='inspection';R.vis.build=true;R.step='build';logr('Engineer started a quote from the inspection');render();break;
  }
});
function setPath(o,p,v){const k=p.split('.');const last=k.pop();k.reduce((x,y)=>x[y],o)[last]=v;}
document.addEventListener('input',e=>{
  const t=e.target,n=t.dataset.f;if(n)S.f[n]=t.value;
  if(t.dataset.ob){const [i,fl]=t.dataset.ob.split(':');if(fl==='t')S.obs[+i].t=t.value;}
  if(t.dataset.r&&!['checkbox','date'].includes(t.type))setPath(R,t.dataset.r,t.value);
  if(t.dataset.pl){const [l,i,f]=t.dataset.pl.split(':');R[l][+i][f]=t.value;const x=$('#live');if(x){const keepSend=x.querySelector('[data-act=send]');document.querySelectorAll('[data-lc]').forEach(e=>e.textContent=money(qh(R.labour[+e.dataset.lc])*RULES.rate));x.querySelectorAll('.panel,.earn,details').forEach(e=>e.remove());x.insertAdjacentHTML('afterbegin',liveHtml());}}
});
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset.tick;if(k)S.tick[k]=t.checked;
  if(t.dataset.svc!==undefined&&t.tagName==='SELECT'){const v=t.value;if(v.startsWith('Habitation')&&S.vehicle!=='motorhome')S=fresh('motorhome');else if(v.startsWith('Caravan')&&S.vehicle!=='caravan')S=fresh('caravan');S.service=v;render();return;}
  if(t.dataset.ob){const [i,fl]=t.dataset.ob.split(':');if(fl==='r')S.obs[+i].r=t.checked;}
  if(t.dataset.r&&['checkbox','date'].includes(t.type)){setPath(R,t.dataset.r,t.type==='checkbox'?t.checked:t.value);keep();render();}
  if(t.dataset.rule){const r=t.dataset.rule;RULES[r]=t.type==='checkbox'?t.checked:t.tagName==='SELECT'&&r!=='vatBase'&&r!=='shareMode'?+t.value:t.type==='number'?(+t.value||0):t.value;keep();render();}
});

function initSig(){
  document.querySelectorAll('canvas.sigpad').forEach(c=>{
    c.width=c.clientWidth;c.height=140;
    const ctx=c.getContext('2d'),who=c.dataset.sig;
    ctx.lineWidth=2.4;ctx.lineCap='round';ctx.strokeStyle=getComputedStyle(document.body).color;
    if(S.sig[who]){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,c.width,c.height);im.src=S.sig[who];}
    let down=false;
    const pt=e=>{const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
    c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);const [x,y]=pt(e);ctx.beginPath();ctx.moveTo(x,y);};
    c.onpointermove=e=>{if(!down)return;const [x,y]=pt(e);ctx.lineTo(x,y);ctx.stroke();};
    const end=()=>{if(!down)return;down=false;try{S.sig[who]=c.toDataURL();}catch(_){}};
    c.onpointerup=end;c.onpointercancel=end;
  });
}
renderRules();$('#rbtn').onclick=()=>{const b=$('#rulesbox');b.hidden=!b.hidden;$('#rbtn').setAttribute('aria-expanded',!b.hidden);};render();
</script>
